<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%93%3C/text%3E%3C/svg%3E" />
    <title>Ancla · Versiones</title>
    <meta
      name="description"
      content="Cada copia del registro de compra pública que la fuente publicó, su raíz Merkle, y la diferencia fila por fila entre una copia y la siguiente."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./ancla.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <a class="wordmark" href="./index.html">Ancla</a>
        <nav>
          <a href="./index.html" data-t="nav.changes">Cambios</a>
          <a href="./versions.html" aria-current="page" data-t="nav.versions">Versiones</a>
          <a href="./verify.html" data-t="nav.verify">Verificar</a>
          <a href="./api" data-t="nav.api">API</a>
        </nav>
        <a class="upsite" href="https://decentralamerica.com/">DecentralAmerica</a>
        <div class="langs" role="group" data-t-title="lang.switch">
          <button type="button" data-lang="es">ES</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main>
      <div id="banner" class="banner hidden"></div>

      <div class="prose">
        <p class="eyebrow" data-t="app.tagline">Registro verificable de la compra pública</p>
        <h1 data-t="versions.title" data-t-document-title="versions.title">
          Cada copia que la fuente publicó
        </h1>
        <p class="lede" data-t="versions.intro"></p>
      </div>

      <div id="source-picker" class="srcpicker hidden" role="group"></div>

      <div id="periods"><p class="skeleton" data-t="common.loading">Cargando</p></div>

      <h2 data-t="versions.recovery">Qué ya no se puede recuperar</h2>
      <p class="note" data-t="versions.recoveryIntro"></p>
      <div id="recovery"></div>

      <p class="note" data-t="note.forwardOnly"></p>
    </main>

    <footer>
      <div class="footer-inner">
        <p data-t="note.provesWhat"></p>
        <p class="mono" id="anchor-line"></p>
        <p><a class="upsite" href="https://decentralamerica.com/">DecentralAmerica</a></p>
      </div>
    </footer>

    <script type="module" src="./versions.js"></script>
  </body>
</html>
