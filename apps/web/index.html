<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ancla</title>
    <meta
      name="description"
      content="Registro verificable de la compra pública de Costa Rica. Qué cambió en los datos publicados, cuándo, y en cuál institución."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./ancla.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <a class="wordmark" href="./index.html">Ancla</a>
        <nav>
          <a href="./index.html" aria-current="page" data-t="nav.changes">Cambios</a>
          <a href="./verify.html" data-t="nav.verify">Verificar</a>
          <a href="/api" data-t="nav.api">API</a>
        </nav>
        <div class="langs" role="group" data-t-title="lang.switch">
          <button type="button" data-lang="es">ES</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main>
      <div id="banner" class="banner hidden"></div>

      <div class="prose">
        <p class="eyebrow" data-t="app.tagline">Registro verificable de la compra pública</p>
        <h1 data-t="feed.title" data-t-document-title="feed.title">
          Qué cambió en el registro publicado
        </h1>
        <p class="lede" data-t="feed.intro"></p>
      </div>

      <dl class="stats" id="stats"></dl>

      <h2 data-t="feed.filters">Filtros</h2>
      <form class="filters" id="filters">
        <div class="field">
          <label for="f-month" data-t="feed.filter.month"></label>
          <select id="f-month" name="month"></select>
        </div>
        <div class="field">
          <label for="f-kind" data-t="feed.filter.kind"></label>
          <select id="f-kind" name="kind"></select>
        </div>
        <div class="field">
          <label for="f-institution" data-t="feed.filter.institution"></label>
          <input id="f-institution" name="institution" inputmode="numeric" placeholder="4000042138" />
        </div>
        <div class="field">
          <label for="f-date" data-t="feed.filter.date"></label>
          <input id="f-date" name="date" type="date" />
        </div>
        <div class="row" style="margin: 0">
          <button type="submit" data-t="feed.filter.apply"></button>
          <button type="button" class="ghost" id="clear" data-t="feed.filter.clear"></button>
        </div>
      </form>

      <p class="count" id="count"></p>
      <div id="feed"><p class="skeleton" data-t="common.loading">Cargando</p></div>
      <div class="row">
        <button type="button" class="ghost hidden" id="more" data-t="feed.loadMore"></button>
      </div>

      <p class="note" data-t="note.sourceIsSicop"></p>
      <p class="note" data-t="note.forwardOnly"></p>
    </main>

    <footer>
      <div class="footer-inner">
        <p data-t="note.provesWhat"></p>
        <p class="mono" id="anchor-line"></p>
      </div>
    </footer>

    <script type="module" src="./feed.js"></script>
  </body>
</html>
